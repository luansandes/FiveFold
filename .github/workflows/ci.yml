name: Fivefold verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext api/queue_publish.ts api/queue_consumer.ts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy fivefold scripts
      - run: python scripts/migrate.py
        env:
          DATABASE_URL: sqlite:///./ci-fivefold.db
      - run: pytest --cov=fivefold --cov-report=term-missing
